<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spinner Test</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      gap: 40px;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Option 1: CSS Conic Gradient with Mask */
    .spinner-1 {
      position: relative;
      width: 88px;
      height: 88px;
      animation: spin 1.1s linear infinite;
    }

    .spinner-1-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 70deg,
        rgba(255, 255, 255, 0.04) 110deg,
        rgba(255, 255, 255, 0.15) 160deg,
        rgba(255, 255, 255, 0.35) 220deg,
        rgba(255, 255, 255, 0.7) 290deg,
        #ffffff 355deg,
        #ffffff 360deg
      );
      mask: radial-gradient(farthest-side, transparent calc(100% - 4.5px), #fff calc(100% - 4px));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4.5px), #fff calc(100% - 4px));
    }

    .spinner-1-cap {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 4.5px;
      height: 4.5px;
      border-radius: 50%;
      background: #ffffff;
    }

    /* Option 2: Pure SVG with mask and conic-gradient / multiple arc gradients */
    .spinner-2 {
      width: 88px;
      height: 88px;
      animation: spin 1.1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner-1">
    <div class="spinner-1-ring"></div>
    <div class="spinner-1-cap"></div>
  </div>
</body>
</html>
